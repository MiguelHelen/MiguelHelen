name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Executa diariamente à meia-noite
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: MiguelHelen
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230A74DA&color_dots=%23E1ECF7,%239CC9F5,%235AA7EC,%232E86E8,%230A74DA&color_empty=%23EBEFF3

      - name: Push to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
